# .github/workflows/ci.yml
name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 合规静态检查（禁止交易语义）
        run: python3 scripts/check_no_trade.py
      - name: Install & Test
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]" respx
          .venv/bin/python -m pytest -q
      - name: Lint (ruff)
        run: cd backend && .venv/bin/ruff check app tests
      - name: Format check (yapf)
        run: cd backend && .venv/bin/yapf -dr app tests
      - name: Type check (mypy)
        run: cd backend && .venv/bin/mypy app
      - name: Commitlint
        run: |
          # checkout 默认 fetch-depth=1，需先拉取 origin/main 引用才能做 --from 对比
          git fetch origin main --depth=1 || true
          npm ci
          npx --yes @commitlint/cli --from origin/main --to HEAD
        env:
          NODE_OPTIONS: ''
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        working-directory: frontend
        run: |
          npm ci || npm install
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Format check (prettier)
        working-directory: frontend
        run: npm run format:check
      - name: Build
        working-directory: frontend
        run: npm run build
